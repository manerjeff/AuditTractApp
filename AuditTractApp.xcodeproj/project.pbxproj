/* Begin PBXShellScriptBuildPhase section */
		ADEC76CE307F094B00F896FE /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			inputPaths = (
				"$(SRCROOT)/NIST_SP_800_53.xlsx",
			);
			outputPaths = (
				"$(SRCROOT)/AuditTractApp/controls.json",
			);
			shellPath = /bin/sh;
			shellScript = (
				"export PATH=\"/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH\"",
				"",
				"# Auto-detect Python executable",
				"PYTHON_BIN=$(which python3 || echo \"/usr/bin/python3\")",
				"",
				"EXCEL_FILE=\"${SRCROOT}/NIST_SP_800_53.xlsx\"",
				"OUTPUT_JSON=\"${SRCROOT}/AuditTractApp/\"Services & Pipeline\"/controls.json\"",
				"",
				"if [ -f \"$EXCEL_FILE\" ]; then",
				"    echo \"Converting $EXCEL_FILE to $OUTPUT_JSON...\"",
				"    \"$PYTHON_BIN\" -c \"",
				"import sys, json",
				"",
				"try:",
				"    import pandas as pd",
				"    excel_path = '$EXCEL_FILE'",
				"    output_path = '$OUTPUT_JSON'",
				"",
				"    df = pd.read_excel(excel_path)",
				"    df_c = df[df['Control (or Control Enhancement) Identifier'].notna()].copy()",
				"    df_c['Control Family'] = df_c['Control Family'].ffill()",
				"",
				"    json_output = []",
				"    for _, r in df_c.iterrows():",
				"        rel = [x.strip() for x in str(r['Related Controls']).split(',') if x.strip() and str(x) != 'nan'] if pd.notna(r['Related Controls']) else []",
				"        json_output.append({",
				"            'id': f\\\"NIST-{str(r['Control (or Control Enhancement) Identifier']).strip()}\\\",",
				"            'frameworkKey': 'NIST',",
				"            'title': str(r['Control (or Control Enhancement) Name']).title(),",
				"            'category': str(r['Control Family']),",
				"            'controlStatement': str(r['Control Statement']) if pd.notna(r['Control Statement']) else '',",
				"            'discussion': str(r['Discussion']) if pd.notna(r['Discussion']) else '',",
				"            'relatedControls': rel",
				"        })",
				"",
				"    envelope = {",
				"        'version': '2026.10.13.1',",
				"        'updatedAt': '2026-10-13T21:00:00Z',",
				"        'controls': json_output",
				"    }",
				"",
				"    with open(output_path, 'w') as f:",
				"        json.dump(envelope, f, indent=2)",
				"",
				"    print(f'Successfully compiled {len(json_output)} controls into envelope controls.json')",
				"except Exception as e:",
				"    print(f'Warning in Build Phase script: {e}', file=sys.stderr)",
				"\"",
				"else",
				"    echo \"Warning: $EXCEL_FILE not found in SRCROOT. Skipping auto-conversion.\"",
				"fi",
				"",
				"# Always exit 0 so Xcode compilation proceeds smoothly",
				"exit 0",
				"",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

